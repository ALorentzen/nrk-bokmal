<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <title>NRK Bokmål</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 230px;
      padding: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    p {
      color: #555;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1><span class="dot"></span>NRK Bokmål</h1>
  <p>Konverterer nynorsk automatisk til bokmål på alle NRK-sider.</p>
  <span class="badge">Aktiv på nrk.no</span>
  <p class="note">Oppdager artikler med <code>lang="nn"</code> og oversetter ordformer automatisk.</p>
</body>
</html>
