<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <title>NRK Bokmål</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 210px;
      padding: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    p {
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1><span class="dot"></span>NRK Bokmål</h1>
  <p>Aktiv — konverterer nynorsk til bokmål automatisk.</p>
</body>
</html>
